[package]
name = "sonata-app"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sonata"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.5.1"
rfd = "0.16"
trash = "5"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
sonata-core = { path = "../../crates/sonata-core" }
herdr-client = { path = "../../crates/herdr-client" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", features = ["exception"] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std", "block2", "objc2-app-kit", "WKWebView", "WKContentWorld", "WKFrameInfo", "WKSecurityOrigin",
  "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController",
] }

[dev-dependencies]
sonata-core = { path = "../../crates/sonata-core", features = ["test-util"] }
tempfile.workspace = true
