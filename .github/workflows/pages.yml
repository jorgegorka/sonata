name: Deploy homepage to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'scripts/release.py'
      - 'scripts/pages.py'
      - 'scripts/tests/test_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master' || github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Test Pages verification
        run: python3 -m unittest discover -s scripts/tests -p 'test_pages.py' -v
      - name: Advertise available platform downloads
        run: python3 scripts/release.py site
      - name: Record deployed revision and file checksums
        run: python3 scripts/pages.py record
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public homepage and files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/pages.py verify --url "$PAGE_URL"
