name: Publish desktop release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/release.py check-version --tag "$GITHUB_REF_NAME"
      - run: npm --prefix app ci --engine-strict
      - run: npm --prefix app test
      - run: cargo test --locked --workspace
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Sign, notarize and verify the Mac release
        run: bash scripts/macos-release.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-aarch64
          path: release-dist/
          if-no-files-found: error
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/release.py check-version --tag "$GITHUB_REF_NAME"
      - run: docker build -t sonata-linux -f scripts/linux.Dockerfile scripts
      - run: |
          mkdir -p release-dist
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/release-dist:/artifacts" sonata-linux --package
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-dist/
          if-no-files-found: error
  publish:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true
      - run: python3 scripts/release.py finalize
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'This release already exists; release artifacts are immutable.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-dist/* --verify-tag --draft --title "Sonata $GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh workflow run pages.yml --ref master
